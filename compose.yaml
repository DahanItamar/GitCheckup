# GitCheckup on a host you own.
#
# Bound to 127.0.0.1 on purpose: the container is not the edge. Your existing
# reverse proxy terminates TLS and forwards to it, which is also what makes
# TRUSTED_CLIENT_IP_HEADER answerable — see lib/client-ip.ts.
#
#   docker compose up -d --build
#
services:
  gitcheckup:
    build: .
    image: gitcheckup:latest
    restart: unless-stopped
    # Change the left-hand port if 3000 is taken by something already running.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # Without a cap these grow until the disk is full, which on a small box
      # is the outage you did not plan for.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
