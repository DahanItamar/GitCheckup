server {
    server_name gitcheckup.com www.gitcheckup.com;

    # NOTE: snippets/security-headers.conf is deliberately NOT included here.
    # Its CSP sets `script-src 'self'` with no `'unsafe-inline'`. Browsers enforce
    # the INTERSECTION of multiple CSP headers, so it would override the app's
    # own, block Next's inline hydration script, and leave a page that returns
    # 200 and does nothing. GitCheckup ships its own headers — see next.config.ts.

    # Only Cloudflare may reach the origin.
    #
    # Not only a DDoS shield: the app trusts CF-Connecting-IP for its per-IP
    # rate limit, and that header is only trustworthy because Cloudflare
    # overwrites whatever the caller sent. Anyone who found the origin address
    # could otherwise forge it and get an unlimited number of cold scores.
    #
    # $from_cloudflare is keyed on $realip_remote_addr — the address that
    # actually opened the socket — because real_ip has by this point rewritten
    # $remote_addr to the visitor, and matching on that would allowlist
    # visitors instead of Cloudflare. Both files are regenerated weekly by
    # /usr/local/sbin/refresh-cloudflare-ips.sh; a stale list 403s real people.
    include snippets/cloudflare-realip.conf;
    if ($from_cloudflare = 0) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is the visitor, not Cloudflare: real_ip above has
        # already substituted it from CF-Connecting-IP. Never $http_x_real_ip
        # or anything else the caller can set — the app reads this to charge
        # the per-IP cold-score limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gitcheckup.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gitcheckup.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.gitcheckup.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gitcheckup.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gitcheckup.com www.gitcheckup.com;
    return 404; # managed by Certbot




}