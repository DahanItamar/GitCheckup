name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job below is blocking (SPEC §4). None of them touch the network or
# need a secret: the rubric is a pure function and the tests never reach
# GitHub or Postgres, which is the whole point of keeping lib/score/ pure.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Circular dependencies
        run: pnpm deps:check
